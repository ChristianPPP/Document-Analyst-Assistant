<div class="chat-container">
  <div class="mensajes">
    <div *ngFor="let mensaje of mensajes" [ngClass]="mensaje.emisor">
      {{ mensaje.texto }}
    </div>
  </div>

  <div class="input-container">
    <input [(ngModel)]="nuevoMensaje" (keyup.enter)="enviarMensaje()" placeholder="Escribe un mensaje..." />
    <button (click)="enviarMensaje()">Enviar</button>
  </div>
</div>
